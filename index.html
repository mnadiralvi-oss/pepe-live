<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEPE Live" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>PEPE Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0b1220; color: #e8eefc; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(420px, 100%); background: #141c2e; border: 1px solid #2a3550;
      border-radius: 18px; padding: 20px 18px 18px; box-shadow: 0 16px 48px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: #9aabc8; letter-spacing: .02em; text-align: center; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .cell {
      background: #0f1728; border: 1px solid #2a3550; border-radius: 14px;
      padding: 16px 12px; text-align: center; min-height: 92px;
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
    }
    .label { font-size: 12px; color: #7a8ba8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 22px; font-weight: 800; line-height: 1.15; word-break: break-word; }
    .value.up { color: #3dda8a; }
    .value.down { color: #ff6b6b; }
    .value.neutral { color: #e8eefc; }
    .err { color: #ff8e8e; font-size: 13px; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PEPE Live · Binance</h1>
    <div class="grid">
      <div class="cell">
        <div class="label">Pro</div>
        <div class="value up" id="proVal">—</div>
      </div>
      <div class="cell">
        <div class="label">Target</div>
        <div class="value neutral" id="targetVal">—</div>
      </div>
      <div class="cell">
        <div class="label">PEPE</div>
        <div class="value neutral" id="pepeVal">—</div>
      </div>
      <div class="cell">
        <div class="label">Bag</div>
        <div class="value neutral" id="bagVal">—</div>
      </div>
    </div>
    <div class="err" id="err" hidden></div>
  </div>
  <script>
    const COINS = 177322500;
    const BUY = 468;
    const SELL = 550;
    const SPAN = SELL - BUY;
    const BINANCE = [
      'https://data-api.binance.vision/api/v3/ticker/price?symbol=PEPEUSDT',
      'https://api1.binance.com/api/v3/ticker/price?symbol=PEPEUSDT',
      'https://api.binance.com/api/v3/ticker/price?symbol=PEPEUSDT'
    ];
    const FX = 'https://open.er-api.com/v6/latest/USD';

    async function fetchPrice() {
      let lastErr;
      for (const url of BINANCE) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          return parseFloat(j.price);
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Binance failed');
    }

    async function fetchPkr() {
      const r = await fetch(FX, { cache: 'no-store' });
      if (!r.ok) throw new Error('FX HTTP ' + r.status);
      const j = await r.json();
      return parseFloat(j.rates.PKR);
    }

    async function refresh() {
      const err = document.getElementById('err');
      err.hidden = true;
      try {
        const [price, pkr] = await Promise.all([fetchPrice(), fetchPkr()]);
        const short = Math.round(price * 1e8);
        const bag = COINS * price * pkr;
        const profit = (price - BUY / 1e8) * COINS * pkr;
        const proK = Math.round(profit / 1000);
        const target = ((short - BUY) / SPAN) * 100;
        const bagK = Math.floor(bag / 1000);
        const up = proK >= 0;
        const proEl = document.getElementById('proVal');
        proEl.className = 'value ' + (up ? 'up' : 'down');
        proEl.textContent = (up ? '' : '') + proK + 'k';
        const tEl = document.getElementById('targetVal');
        tEl.className = 'value ' + (target >= 0 ? 'up' : 'down');
        tEl.textContent = (target >= 0 ? '+' : '') + target.toFixed(1) + '%';
        document.getElementById('pepeVal').textContent = String(short);
        document.getElementById('bagVal').textContent = 'PKR ' + bagK + 'K';
      } catch (e) {
        err.hidden = false;
        err.textContent = 'Update failed';
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
