<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEPE Live" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>PEPE Live</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0b1220; color: #e8eefc; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(420px, 100%); background: #141c2e; border: 1px solid #2a3550;
      border-radius: 18px; padding: 28px 24px; box-shadow: 0 16px 48px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: #9aabc8; letter-spacing: .04em; text-transform: uppercase; }
    .block {
      margin: 14px 0 0; font-size: 26px; font-weight: 800; line-height: 1.45;
      white-space: pre-wrap; letter-spacing: .2px;
    }
    .block.up { color: #3dda8a; }
    .block.down { color: #ff6b6b; }
    .meta { margin-top: 18px; font-size: 12px; line-height: 1.55; color: #7a8ba8; }
    .err { color: #ff8e8e; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PEPE live · buy-back</h1>
    <pre class="block up" id="block">Loading…</pre>
    <div class="meta" id="meta">Sell 510 → buy-back 470 (=100%) · Target = (510 − short) / 40 × 100<br>Auto-refresh · Binance PEPE/USDT</div>
    <div class="err" id="err" hidden></div>
  </div>
  <script>
    const COINS = 177322500;
    const FROM = 510;
    const TO = 470;
    const SPAN = FROM - TO;
    const BINANCE = [
      'https://data-api.binance.vision/api/v3/ticker/price?symbol=PEPEUSDT',
      'https://api1.binance.com/api/v3/ticker/price?symbol=PEPEUSDT',
      'https://api.binance.com/api/v3/ticker/price?symbol=PEPEUSDT'
    ];
    const FX = 'https://open.er-api.com/v6/latest/USD';

    async function fetchPrice() {
      let lastErr;
      for (const url of BINANCE) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          return parseFloat(j.price);
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Binance failed');
    }

    async function fetchPkr() {
      const r = await fetch(FX, { cache: 'no-store' });
      if (!r.ok) throw new Error('FX HTTP ' + r.status);
      const j = await r.json();
      return parseFloat(j.rates.PKR);
    }

    async function refresh() {
      const err = document.getElementById('err');
      err.hidden = true;
      try {
        const [price, pkr] = await Promise.all([fetchPrice(), fetchPkr()]);
        const short = Math.round(price * 1e8);
        const bag = COINS * price * pkr;
        const proPkr = (FROM / 1e8 - price) * COINS * pkr;
        const proK = Math.round(proPkr / 1000);
        const target = ((FROM - short) / SPAN) * 100;
        const bagK = Math.floor(bag / 1000);
        const neg = target < 0; // red when Target % negative (short above 510)
        const emoji = neg ? '🔴' : '🟢';
        const targetStr = (target >= 0 ? '+' : '') + target.toFixed(1);
        const text =
          emoji + ' Pro:' + proK + 'k/🎯:' + targetStr + '%\n' +
          '🟢 PEPE ' + short + '\n' +
          '💰 Bag : PKR ' + bagK + 'K';
        const block = document.getElementById('block');
        block.className = 'block ' + (neg ? 'down' : 'up');
        block.textContent = text;
        document.title = 'Pro ' + proK + 'k · PEPE ' + short;
        document.getElementById('meta').innerHTML =
          'Sell 510 → buy-back 470 (=100%) · Target = (510 − short) / 40 × 100<br>' +
          'Binance PEPE/USDT ' + price + ' · updated just now';
      } catch (e) {
        err.hidden = false;
        err.textContent = 'Update failed';
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
